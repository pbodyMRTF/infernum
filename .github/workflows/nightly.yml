name: Nightly Build

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    name: Build Nightly
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build client and server
        run: |
          ./gradlew clean dist serverDist \
            -PbuildLabel="Nightly $(date +'%Y.%m.%d')"

      - name: List build artifacts
        run: |
          ls -lah build/dist/

      - name: Create Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: nightly-${{ github.run_number }}
          name: "Nightly ${{ github.run_number }}"
          body: |
            ## Infernum Nightly

            Automated nightly build.

            **Commit:** `${{ github.sha }}`

            ⚠️ Nightly builds are development versions and may contain bugs or incomplete features.
          prerelease: true
          files: |
            build/dist/infernum-*-dist.jar
            build/dist/infernum-server-*-dist.jar
