      - name: Delete old nightly releases
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const keep = 7;

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            const nightlies = releases
              .filter((release) => release.tag_name.startsWith("nightly-"))
              .sort(
                (a, b) =>
                  new Date(b.created_at).getTime() -
                  new Date(a.created_at).getTime()
              );

            for (const release of nightlies.slice(keep)) {
              console.log(`Deleting ${release.tag_name}`);

              try {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id
                });

                console.log(`Deleted release ${release.tag_name}`);

                try {
                  await github.rest.git.deleteRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `tags/${release.tag_name}`
                  });

                  console.log(`Deleted tag ${release.tag_name}`);
                } catch (error) {
                  console.log(
                    `Could not delete tag ${release.tag_name}: ${error.message}`
                  );
                }
              } catch (error) {
                console.error(
                  `Could not delete release ${release.tag_name}: ${error.message}`
                );
              }
            }
